[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grammar-fix"
version = "0.1.0"
description = "Local-LLM (Ollama) proofreading for any macOS text field"
requires-python = ">=3.12"
dependencies = [
    "pyobjc-framework-Cocoa>=10",               # NSPasteboard, NSWorkspace, AppKit
    "pyobjc-framework-Quartz>=10",              # synthetic key presses
    "pyobjc-framework-ApplicationServices>=10", # Accessibility (AXUIElement)
    "pyobjc-framework-NaturalLanguage>=10",     # on-device language detection
    "rumps>=0.4",                               # menu bar item
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grammar-fix = "grammar_fix.app:main"

[tool.setuptools]
packages = ["grammar_fix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
